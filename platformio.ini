; Round-screen Spotify knob player.
;
;   pio run -e native && ./.pio/build/native/program     desktop
;   pio test -e test                                     host unit tests
;   pio run -e esp32 -t upload                           the board

[platformio]
default_envs = native

[env]
build_flags = -std=c++14 -DAPP_NAME=\"knob-spotify\"

; ---------------------------------------------------------------------------
; Desktop SDL build. The primary development target: the visuals are tuned
; here and flashed once they look right.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DDESKTOP=1
    -I src
    -I${sysenv.HOMEBREW_PREFIX}/include
    -I${sysenv.HOMEBREW_PREFIX}/include/SDL2
    -L${sysenv.HOMEBREW_PREFIX}/lib
    -lSDL2
    -g
    -O2
; The network, Spotify and config layers are device-only for now.
;
; They are Arduino-based (WiFiClientSecure, HTTPClient, Preferences) and the
; ancestor project ran them on the desktop too, against a libcurl HttpClient. That
; is worth restoring - it is how the ancestor tuned its optimistic-UI timing
; without a board - but it needs a desktop HttpClient and ArduinoJson here, and
; the visual work does not depend on it.
build_src_filter =
    +<*>
    -<platform/esp32/>
    -<main_esp32.cpp>
    -<net/>
    -<spotify/>
    -<config/>
    -<art/ArtCache.cpp>
    -<art/CoverCache.cpp>

; ---------------------------------------------------------------------------
; Host unit tests. No SDL, no hardware: everything under test is display-free
; or operates on a plain memory buffer, which is the point - it runs anywhere
; and in milliseconds.
; ---------------------------------------------------------------------------
[env:test]
platform = native
test_framework = unity
; PlatformIO does not compile src/ into a test binary unless told to.
test_build_src = yes
build_flags =
    -std=c++14
    -I src
    -O1
build_src_filter =
    +<gfx/*>
    +<fx/*>
    +<audio/*>
    +<art/*>
    -<art/ArtCache.cpp>
    -<art/CoverCache.cpp>
    +<core/*>
    -<core/Log.cpp>
    +<input/*>
    +<shell/*>
    +<platform/desktop/FrameDump.cpp>
    +<platform/desktop/BigAllocHost.cpp>
    +<platform/desktop/WavMic.cpp>
    +<views/*>

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Knob-Touch-LCD-1.8.
;
; ESP32-S3R8: 8MB OCTAL PSRAM, 16MB flash, native USB-JTAG (so the port is a
; usbmodem, not a usbserial - a charge-only cable presents no port at all).
; ---------------------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Two unflags, both load-bearing:
;   -std=gnu++11  the Arduino ESP32 core appends it and it beats anything set
;                 in [env], so C++14 features fail to compile without this.
;   -Os           the core's default. This is a real-time renderer whose inner
;                 loops are pure integer arithmetic, and -Os declines to unroll
;                 or fully inline them. Measured difference is in the commit log.
;
; -O3 with -funroll-loops rather than -O2: every render loop here measured at
; roughly 3.5 cycles per operation, which is the signature of load-to-use stalls
; on an in-order core, not of instruction count. Unrolling interleaves
; independent load chains, which is the only thing that hides that latency.
build_unflags = -std=gnu++11 -Os
build_flags =
    ${env.build_flags}
    -std=gnu++14
    -O3
    -funroll-loops
    -DDEVICE=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -I src
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; OCTAL PSRAM (the R8 part), not quad. Getting this wrong gives a board that
; boots and reports zero PSRAM, which reads as a hardware fault.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
    +<*>
    -<platform/desktop/>
    -<main.cpp>
